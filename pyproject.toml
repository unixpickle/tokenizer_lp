[project]
name = "tokenizer-lp"
version = "0.1.0"
description = "CPU LP and greedy BPE tokenizer training utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "highspy>=1.8",
    "matplotlib>=3.8",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
cma = ["cma>=4.0"]

[project.scripts]
tokenizer-lp-train = "tokenisation_lp.train_eval:main"
tokenizer-lp-plot-log-bounds = "tokenisation_lp.plot_log_bounds:main"
tokenizer-lp-branch-split = "tokenisation_lp.branch_split_lp:main"
tokenizer-lp-branch-cut-tokenizer = "tokenisation_lp.branch_cut_tokenizer:main"
tokenizer-lp-subset-hulls = "tokenisation_lp.subset_hull_diagnostics:main"
tokenizer-lp-pair-hull-diagnostics = "tokenisation_lp.pair_hull_diagnostics:main"
tokenizer-lp-alternative-pairs = "tokenisation_lp.alternative_pair_diagnostics:main"
tokenizer-lp-pair-cut-impact = "tokenisation_lp.pair_cut_impact:main"
tokenizer-lp-triplet-hulls = "tokenisation_lp.triplet_hull_diagnostics:main"
tokenizer-lp-next-pair-cuts = "tokenisation_lp.next_pair_cut_analysis:main"
tokenizer-lp-shared-fractional-pairs = "tokenisation_lp.shared_fractional_pair_test:main"
tokenizer-lp-edge-ablation = "tokenisation_lp.edge_coefficient_ablation:main"
tokenizer-lp-reduced-edge-pair-scan = "tokenisation_lp.reduced_edge_pair_scan:main"
tokenizer-lp-cut-frontier = "tokenisation_lp.cut_frontier_exploration:main"
tokenizer-lp-triple-cut-diagnostics = "tokenisation_lp.triple_cut_diagnostics:main"
tokenizer-lp-pair-cut-templates = "tokenisation_lp.pair_cut_template_diagnostics:main"
tokenizer-lp-cma-rounding = "tokenisation_lp.cma_rounding_search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenisation_lp"]
exclude = [
    "tokenisation_lp/.git/**",
    "tokenisation_lp/bpe_tokenizers_climbmix/**",
    "tokenisation_lp/rounded_tokenizers/**",
]
